{% extends "base.html" %}

{% block title %}Contact | Alice{% endblock %}

{% block content %}

<section class="contact">

    <h1>Get In Touch</h1>

    <p>
        If you'd like to get in touch about an opportunity, collaboration
        or just want to connect, feel free to send me a message.
    </p>

    <form id="contact-form" action="https://formspree.io/f/mzezqwbz" method="POST">

        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>
        <textarea
            id="message"
            name="message"
            rows="6"
            required></textarea>

        <button type="submit">Send Message</button>

    </form>

    <div id="success-message" style="display: none;">
        <h2>Message received!</h2>
        <p>Thank you for getting in touch.</p>
    </div>

</section>

{% endblock %}
